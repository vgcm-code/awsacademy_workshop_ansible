---
haproxy_package: haproxy
haproxy_service: haproxy
haproxy_bind_address: "0.0.0.0"
haproxy_port: 8080
haproxy_balance: roundrobin
haproxy_timeout_connect: 5s
haproxy_timeout_client: 30s
haproxy_timeout_server: 30s
haproxy_firewall_configure: true

# Grupo de inventário cujos hosts viram backends do HAProxy.
# No laboratório local: webservers. No AAP, use o nome do seu grupo
# (ex.: vinicius-g) via group_vars ou variáveis do Job Template.
haproxy_backend_group: vitoria_loadbalance
haproxy_backend_port: 80

# Lista vazia = montar automaticamente a partir de haproxy_backend_group.
# Para sobrescrever manualmente, use name/address/port sem hostvars hard-coded:
#   haproxy_backend_servers:
#     - { name: app1, address: 10.0.0.11, port: 80 }
haproxy_backend_servers: []
